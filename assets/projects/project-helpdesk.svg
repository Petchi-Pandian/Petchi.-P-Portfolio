  <rect x="980" y="160" width="395" height="850" rx="16" fill="url(#hd-card)" stroke="#26344d" stroke-width="1.5"/>
  <rect x="1005" y="185" width="10" height="10" rx="2" fill="#a855f7"/>
  <text x="1025" y="195" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">UAT VERIFICATION (5)</text>

  <!-- Ticket 3 -->
  <rect x="1005" y="225" width="345" height="180" rx="12" fill="#1b2537" stroke="#334460" stroke-width="1"/>
  <rect x="1025" y="245" width="75" height="24" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="1035" y="261" fill="#34d399" font-size="11" font-weight="700" font-family="sans-serif">UAT PASS</text>
  <text x="1230" y="261" fill="#94a3b8" font-size="11" font-family="sans-serif">#TKT-8861</text>
  <text x="1025" y="295" fill="#ffffff" font-size="14" font-weight="600" font-family="sans-serif">Employee Master Validation Rule</text>
  <text x="1025" y="320" fill="#94a3b8" font-size="12" font-family="sans-serif">Regex validation pattern verified on mobile app</text>
  <text x="1025" y="365" fill="#cbd5e1" font-size="11" font-family="sans-serif">Sign-off received by QA Lead</text>

  <!-- Column 4: Resolved & Closed -->
  <rect x="1420" y="160" width="395" height="850" rx="16" fill="url(#hd-card)" stroke="#26344d" stroke-width="1.5"/>
  <rect x="1445" y="185" width="10" height="10" rx="2" fill="#10b981"/>
  <text x="1465" y="195" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">RESOLVED &amp; DEPLOYED (142)</text>

  <!-- Ticket 4 -->
  <rect x="1445" y="225" width="345" height="160" rx="12" fill="#1b2537" stroke="#334460" stroke-width="1"/>
  <rect x="1465" y="245" width="75" height="24" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="1475" y="261" fill="#34d399" font-size="11" font-weight="700" font-family="sans-serif">DEPLOYED</text>
  <text x="1670" y="261" fill="#94a3b8" font-size="11" font-family="sans-serif">#TKT-8820</text>
  <text x="1465" y="295" fill="#ffffff" font-size="14" font-weight="600" font-family="sans-serif">Automated Teams Notification Flow</text>
  <text x="1465" y="320" fill="#94a3b8" font-size="12" font-family="sans-serif">Adaptive Cards integrated into incident channels</text>
  <text x="1465" y="355" fill="#34d399" font-size="11" font-family="sans-serif">&check; Production Release v2.4</text>
</svg>
