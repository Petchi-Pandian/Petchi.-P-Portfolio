    <text x="50" y="232" fill="#94a3b8" font-size="11" font-family="sans-serif">Triggered from candidate acceptance &bull; 8 mins ago</text>

    <rect x="0" y="265" width="560" height="70" rx="10" fill="#141c2c" stroke="#26344d" stroke-width="1"/>
    <circle cx="30" cy="300" r="8" fill="#10b981"/>
    <text x="50" y="297" fill="#ffffff" font-size="13" font-weight="600" font-family="sans-serif">ID Badge &amp; Parking RFID Pass Generation</text>
    <text x="50" y="317" fill="#94a3b8" font-size="11" font-family="sans-serif">Facilities notification dispatched &bull; 24 mins ago</text>

    <rect x="0" y="350" width="560" height="70" rx="10" fill="#141c2c" stroke="#26344d" stroke-width="1"/>
    <circle cx="30" cy="385" r="8" fill="#38bdf8"/>
    <text x="50" y="382" fill="#ffffff" font-size="13" font-weight="600" font-family="sans-serif">SharePoint Security Group Role Assignment</text>
    <text x="50" y="402" fill="#94a3b8" font-size="11" font-family="sans-serif">Graph API batch execution &bull; 1 hour ago</text>

    <rect x="0" y="435" width="560" height="70" rx="10" fill="#141c2c" stroke="#26344d" stroke-width="1"/>
    <circle cx="30" cy="470" r="8" fill="#10b981"/>
    <text x="50" y="467" fill="#ffffff" font-size="13" font-weight="600" font-family="sans-serif">Manager Welcome Email &amp; Orientation Checklist</text>
    <text x="50" y="487" fill="#94a3b8" font-size="11" font-family="sans-serif">Outlook cloud flow executed &bull; 2 hours ago</text>
