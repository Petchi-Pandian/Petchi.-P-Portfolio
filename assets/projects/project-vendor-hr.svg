  <path d="M242 220 L248 226 L259 214" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="250" y="260" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700" font-family="sans-serif">1. Vendor Dossier</text>

  <!-- Line 1-2 -->
  <line x1="285" y1="220" x2="575" y2="220" stroke="#10b981" stroke-width="3"/>

  <!-- Step 2 -->
  <circle cx="610" cy="220" r="24" fill="#10b981"/>
  <path d="M602 220 L608 226 L619 214" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
