<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="vhr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#141a27"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="vhr-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182234" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f1624" stop-opacity="0.95"/>
